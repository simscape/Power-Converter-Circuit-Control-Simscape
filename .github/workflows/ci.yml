# Test this project with MATLAB on Linux and Windows.
# Each job runs the tests of one power converter, using a task from buildfile.m.
# To learn more about MATLAB in GitHub Actions, see
# https://github.com/matlab-actions/overview

name: Power Converter Repository Tests

# Run on every push and pull request (except changes to documentation and
# images only), every Monday, and on demand
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Each job checks out the code, sets up MATLAB, and runs one buildtool task
jobs:

  code-check:
    name: Code Check
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design Control_System_Toolbox Stateflow System_Identification_Toolbox
          cache: true
      - uses: matlab-actions/run-build@v3
        with:
          tasks: Check

  grid-forming-converter:
    name: Grid-Forming Converter
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: matlab-actions/setup-matlab@v3
