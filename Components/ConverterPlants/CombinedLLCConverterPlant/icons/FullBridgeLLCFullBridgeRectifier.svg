  <!-- Full-bridge LLC resonant converter with a full-bridge rectifier, drawn on a 324 x 211 block.
       DC input -> primary bridge -> series Cr and Lr -> transformer with Lm across the primary ->
       rectifier -> Co -> DC output.
       Each dc rail is drawn on its own port row, y = 550 and y = 1600, so every power lead is one straight
       segment out to the block edge. Every row between the rails is mirrored about y = 1075: switch and
       rectifier rows y = 735 and y = 1415, transformer rows y = 905 and y = 1245.
       The gate input and the measurement output sit on the top edge and are deliberately left without leads.
       All six port names are drawn here, each beside its own port, because the block turns Simulink's own
       port labels off: Simulink centres those on the port row, across the lead. -->

  <!-- DC input rails, each running straight out of its own block port -->
